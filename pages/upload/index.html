<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 남기기 · 숭실 한 장</title><link rel="icon" href="../../shared/assets/fallback.svg" type="image/svg+xml"><link rel="stylesheet" href="../../shared/css/common.css"><link rel="stylesheet" href="./upload.css"><script type="module" src="./upload.js"></script></head><body><header id="site-header"></header><main class="page"><section class="intro"><div><p class="eyebrow">LEAVE YOUR LITTLE MOMENT</p><h1>오늘의 숭실을 한 장 남겨요.</h1><p>사진에 담긴 장소와 시간을 함께 기록해요.</p></div><span class="badge">등록 화면 · 기본 틀</span></section><div class="upload-layout"><form id="upload-form" class="panel stack"><label class="upload-box field">업로드할 사진<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required><small class="muted">JPG · PNG · WEBP / 최대 8MB · 서버 전송은 아직 연결되지 않았어요.</small></label><label class="field">촬영 장소명<input name="placeName" maxlength="60" placeholder="예: 중앙 잔디광장" required></label><div class="fields"><label class="field">위도<input name="latitude" type="number" min="-90" max="90" step="any" placeholder="37.4964" required></label><label class="field">경도<input name="longitude" type="number" min="-180" max="180" step="any" placeholder="126.95705" required></label></div><button type="button" id="pick-location" class="button secondary">⌖ 지도에서 위치 선택 · 연결 예정</button><label class="field">사진을 촬영한 날짜와 시간 (한국 시간)<input name="capturedAt" type="datetime-local" step="1" required></label><label class="field">한 줄 설명<textarea name="description" maxlength="160" placeholder="이 순간에 담긴 이야기를 들려주세요." required></textarea></label><button class="button">사진 등록</button><p id="upload-status" role="status"></p></form><aside class="panel upload-notes"><span class="badge">함께 만드는 페이지</span><h2>한 장에 담을 정보</h2><ol><li>사진을 골라요.</li><li>촬영한 위치를 지정해요.</li><li>촬영 시각과 설명을 남겨요.</li></ol><div class="notice">현재는 입력 화면과 연결 지점만 준비되어 있어요. 위치 선택과 실제 사진 저장은 담당 팀원이 연결합니다.</div><p class="muted">촬영 시각과 업로드 시각은 별개예요. 업로드 시각은 향후 서버에서 등록이 완료될 때 기록합니다.</p><p id="upload-auth" class="muted"></p></aside></div></main><footer id="site-footer"></footer></body></html>
