<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>로그인 · 숭실 한 장</title>

    <link rel="icon" href="../../shared/assets/fallback.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="./login.css">

    <script type="module" src="./login.js"></script>
</head>


<body>

<header id="site-header"></header>


<main class="login-page">

    <div class="login-container">

        <!-- 왼쪽 캠퍼스 사진 -->
        <section class="campus-side">

            <div class="campus-overlay"></div>

            <div class="campus-content">

                <p class="campus-small">
                    SOONGSIL UNIVERSITY
                </p>

                <h1>
                    숭실 한 장
                </h1>

                <p class="campus-title">
                    우리가 지나온 곳,<br>
                    그날의 숭실.
                </p>

                <p class="campus-description">
                    매일 걷던 길도,<br>
                    처음 만난 계절도.<br>
                    우리의 순간을 한 장씩 남겨보세요.
                </p>

            </div>

            <div class="campus-bottom">
                SSU · ONE MOMENT, ONE PHOTO
            </div>

        </section>


        <!-- 오른쪽 로그인 -->
        <section class="login-side">

            <div class="login-box">

                <div class="brand">

                    <div class="brand-mark">
                        SSU
                    </div>

                    <div>
                        <strong>숭실 한 장</strong>
                        <span>SOONGSIL PHOTO ARCHIVE</span>
                    </div>

                </div>


                <div class="login-heading">

                    <p class="welcome">
                        WELCOME TO SOONGSIL HANJANG
                    </p>

                    <h2>
                        숭실 한 장에 오신 것을 환영해요.
                    </h2>

                    <p>
                        숭실의 오늘을 한 장씩 만나보세요.
                    </p>

                </div>


                <form id="login-form">

                    <label class="field">

                        <span>학번</span>

                        <input
                            id="student-id"
                            type="text"
                            placeholder="학번을 입력해주세요"
                            autocomplete="username"
                        >

                    </label>


                    <label class="field">

                        <span>비밀번호</span>

                        <input
                            id="password"
                            type="password"
                            placeholder="비밀번호를 입력해주세요"
                            autocomplete="current-password"
                        >

                    </label>


                    <button
                        id="login-button"
                        class="main-login"
                        type="submit"
                    >
                        숭실 한 장 로그인
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button
                    id="browse"
                    class="browse-button"
                    type="button"
                >
                    로그인 없이 둘러보기
                    <span>→</span>
                </button>


                <p
                    id="login-status"
                    role="status"
                ></p>


                <p class="login-footer">
                    우리의 숭실을 한 장에 담다.
                </p>

            </div>

        </section>

    </div>

</main>


<footer id="site-footer"></footer>

</body>

</html>
